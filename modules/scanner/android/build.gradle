plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mybizmate.scan'
version = '0.1.0'

// The scanner core (../cpp) links OpenCV through the AAR's prefab package, and ONNX Runtime through the headers and
// libraries unpacked from its AAR (it has no prefab package). No ndkVersion here: Expo's root project plugin gives
// every module the app's NDK, so libc++_shared.so matches React Native's.
def opencvVersion = '5.1.0'
def ortVersion = '1.32.0'
def cameraxVersion = '1.7.0'  // the scanner camera (ScannerCameraView.kt)
def ortDir = layout.buildDirectory.dir('ort').get().asFile

android {
  namespace "expo.modules.scanner"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DORT_DIR=${ortDir.absolutePath.replace('\\', '/')}"
      }
    }
  }
  buildFeatures {
    prefab true
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }
  sourceSets {
    main {
      assets.srcDirs += ["../assets"]
    }
  }
  packaging {
    jniLibs {
      pickFirsts += ["**/libc++_shared.so"]
    }
  }
}

configurations {
  ortAar
}

dependencies {
  implementation "org.opencv:opencv:${opencvVersion}"
  implementation "com.microsoft.onnxruntime:onnxruntime-android:${ortVersion}"
  ortAar "com.microsoft.onnxruntime:onnxruntime-android:${ortVersion}@aar"
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
  testImplementation "junit:junit:4.13.2"
}

def extractOrt = tasks.register("extractOrt", Sync) {
  it.from(project.provider { zipTree(configurations.ortAar.singleFile) }) {
    include "headers/**", "jni/**"
  }
  it.into(ortDir)
}

// CMake needs the headers and libraries on disk before it configures, not just before it builds.
tasks.matching {
  it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake")
}.configureEach {
  it.dependsOn(extractOrt)
}
preBuild.dependsOn(extractOrt)
